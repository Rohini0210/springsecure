# SpringSecure — disposable scan environment (v1.0.1)
#
# Brings up a throwaway stack, so dynamic scanning never touches persistent
# application state: one PostgreSQL database plus a stub HTTP server that
# stands in for a benchmark Spring Boot application.
#
# IMPORTANT: the `app` service is a stub, NOT a benchmark. No benchmark
# application image is invented here. To scan a real benchmark (CVA, SCA,
# SRA, or another Spring Boot app), replace the `app` service's image /
# command with that application's image, keeping the same port (8080) and
# the disposable volume below. The stub only exists so the disposable
# workflow can be validated without a benchmark image.
#
# Docker is required to run this file. It was NOT available on the machine
# that prepared this release, so `docker compose up` was not executed there;
# the file was validated for YAML syntax only. See scripts/scan-isolated.sh.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: springsecure
      POSTGRES_PASSWORD: springsecure
      POSTGRES_DB: demo
    volumes:
      - demo-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U springsecure -d demo"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./scripts/stub-server.js:/app/stub-server.js:ro
    command: ["node", "stub-server.js", "8080"]
    environment:
      DATABASE_URL: postgres://springsecure:springsecure@db:5432/demo
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  demo-data:
